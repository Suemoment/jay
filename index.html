<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>校园生活记账</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: #20283a;
      background: #f5f7fb;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      padding: 40px 18px;
    }

    .app {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #68748a;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 32px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: #7b8496;
      font-size: 14px;
    }

    .card {
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid #e9edf4;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 26px rgb(34 51 84 / 4%);
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .summary-label {
      color: #727d91;
      font-size: 14px;
    }

    .summary-amount {
      margin-top: 7px;
      color: #315ed5;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .summary-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 16px;
      background: #eef3ff;
      color: #315ed5;
      font-size: 23px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 18px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-hint,
    .bill-count {
      color: #929bad;
      font-size: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 12px;
    }

    .field {
      min-width: 0;
    }

    .field-full,
    .submit-button,
    .form-message {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #566176;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid #e3e8f0;
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: #20283a;
      font: inherit;
      font-size: 15px;
      transition: border-color 150ms, box-shadow 150ms;
    }

    input::placeholder {
      color: #b0b7c4;
    }

    input:focus,
    select:focus {
      border-color: #7897ed;
      box-shadow: 0 0 0 3px rgb(69 109 220 / 12%);
    }

    .submit-button {
      min-height: 48px;
      margin-top: 2px;
      border: 0;
      border-radius: 12px;
      background: #315ed5;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms, transform 150ms;
    }

    .submit-button:hover {
      background: #274fc0;
    }

    .submit-button:active {
      transform: scale(0.99);
    }

    .submit-button:focus-visible {
      outline: 3px solid #aebff5;
      outline-offset: 3px;
    }

    .form-message {
      min-height: 18px;
      margin: -5px 0 0;
      color: #c34141;
      font-size: 13px;
    }

    .bill-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bill-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 0;
      border-top: 1px solid #f0f2f6;
    }

    .bill-item:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .bill-main {
      min-width: 0;
    }

    .bill-title {
      overflow: hidden;
      color: #30394b;
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bill-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
      color: #929bad;
      font-size: 12px;
    }

    .category-tag {
      color: #5272ca;
    }

    .bill-amount {
      flex: 0 0 auto;
      color: #29344a;
      font-size: 16px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      padding: 24px 12px 10px;
      color: #929bad;
      font-size: 14px;
      text-align: center;
    }

    .chart-button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      background: #315ed5;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms, transform 150ms;
    }

    .chart-button:hover {
      background: #274fc0;
    }

    .chart-button:active {
      transform: scale(0.99);
    }

    .chart-button:focus-visible {
      outline: 3px solid #aebff5;
      outline-offset: 3px;
    }

    .chart-message {
      margin: 14px 0 0;
      color: #7b8496;
      font-size: 13px;
      text-align: center;
    }

    .chart-container {
      position: relative;
      width: min(100%, 380px);
      margin: 18px auto 0;
    }

    .analysis-results {
      margin-top: 18px;
    }

    .analysis-summary {
      margin: 0;
      color: #566176;
      font-size: 14px;
      line-height: 1.7;
    }

    .analysis-subheading {
      margin: 18px 0 8px;
      color: #30394b;
      font-size: 14px;
    }

    .analysis-list {
      margin: 0;
      padding-left: 20px;
      color: #68748a;
      font-size: 13px;
      line-height: 1.7;
    }

    .analysis-list li + li {
      margin-top: 6px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 420px) {
      body {
        padding: 28px 14px;
      }

      .card {
        padding: 18px;
        border-radius: 17px;
      }

      .form-grid {
        gap: 13px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">CAMPUS LIFE · DAILY NOTES</p>
      <h1>校园生活记账</h1>
      <p class="subtitle">记下每一笔日常，让生活费花得更明白。</p>
    </header>

    <section class="card summary" aria-label="消费总额">
      <div>
        <div class="summary-label">累计消费</div>
        <div class="summary-amount">¥<span id="totalAmount">0.00</span></div>
      </div>
      <div class="summary-icon" aria-hidden="true">￥</div>
    </section>

    <section class="card" aria-labelledby="chartTitle">
      <div class="section-heading">
        <h2 id="chartTitle">分类消费占比</h2>
        <span class="section-hint">按消费分类汇总</span>
      </div>
      <button id="generateChartButton" class="chart-button" type="button">生成消费饼图</button>
      <p id="chartMessage" class="chart-message" role="status" aria-live="polite">
        点击按钮，根据已保存的账单生成分类占比。
      </p>
      <div id="chartContainer" class="chart-container" hidden>
        <canvas id="expenseChart" role="img" aria-label="各消费分类支出占比饼图"></canvas>
      </div>
    </section>

    <section class="card" aria-labelledby="analysisTitle">
      <div class="section-heading">
        <h2 id="analysisTitle">AI账单分析</h2>
        <span class="section-hint">本地分析，不上传数据</span>
      </div>
      <button id="analyzeBillsButton" class="chart-button" type="button">开始分析账单</button>
      <p id="analysisMessage" class="chart-message" role="status" aria-live="polite">
        分析全部已保存账单，获取消费概况和省钱建议。
      </p>
      <div id="analysisResults" class="analysis-results" hidden>
        <p id="analysisSummary" class="analysis-summary"></p>
        <h3 class="analysis-subheading">分类支出</h3>
        <ul id="analysisBreakdown" class="analysis-list"></ul>
        <h3 class="analysis-subheading">省钱建议</h3>
        <ul id="analysisTips" class="analysis-list"></ul>
      </div>
    </section>

    <section class="card" aria-labelledby="formTitle">
      <div class="section-heading">
        <h2 id="formTitle">记一笔</h2>
        <span class="section-hint">花销随手记</span>
      </div>
      <form id="billForm" class="form-grid">
        <div class="field">
          <label for="amount">金额（元）</label>
          <input id="amount" name="amount" type="number" min="0.01" step="0.01"
            inputmode="decimal" placeholder="例如 12.50" required>
        </div>
        <div class="field">
          <label for="category">消费分类</label>
          <select id="category" name="category" required>
            <option value="食堂">食堂</option>
            <option value="外卖">外卖</option>
            <option value="网购">网购</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="field field-full">
          <label for="note">备注</label>
          <input id="note" name="note" type="text" maxlength="80"
            placeholder="吃了什么、买了什么（选填）">
        </div>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        <button class="submit-button" type="submit">添加账单</button>
      </form>
    </section>

    <section class="card" aria-labelledby="listTitle">
      <div class="section-heading">
        <h2 id="listTitle">账单明细</h2>
        <span id="billCount" class="bill-count">0 笔</span>
      </div>
      <ul id="billList" class="bill-list"></ul>
      <div id="emptyState" class="empty-state">还没有账单，记下今天的第一笔吧。</div>
    </section>
  </main>

  <!-- 使用项目内的 Chart.js，避免外部 CDN 不可用导致图表无法加载。 -->
  <script src="./vendor/chart.umd.js"></script>
  <script>
    const STORAGE_KEY = "campus-life-bills";
    const categories = ["食堂", "外卖", "网购", "其他"];
    const form = document.querySelector("#billForm");
    const amountInput = document.querySelector("#amount");
    const categoryInput = document.querySelector("#category");
    const noteInput = document.querySelector("#note");
    const formMessage = document.querySelector("#formMessage");
    const billList = document.querySelector("#billList");
    const emptyState = document.querySelector("#emptyState");
    const totalAmount = document.querySelector("#totalAmount");
    const billCount = document.querySelector("#billCount");
    const generateChartButton = document.querySelector("#generateChartButton");
    const chartMessage = document.querySelector("#chartMessage");
    const chartContainer = document.querySelector("#chartContainer");
    const expenseChartCanvas = document.querySelector("#expenseChart");
    const analyzeBillsButton = document.querySelector("#analyzeBillsButton");
    const analysisMessage = document.querySelector("#analysisMessage");
    const analysisResults = document.querySelector("#analysisResults");
    const analysisSummary = document.querySelector("#analysisSummary");
    const analysisBreakdown = document.querySelector("#analysisBreakdown");
    const analysisTips = document.querySelector("#analysisTips");
    let expenseChart = null;

    // 从本地存储读取账单；数据损坏时明确提示，并使用空列表继续使用。
    function loadBills() {
      try {
        const savedBills = localStorage.getItem(STORAGE_KEY);
        if (!savedBills) return [];

        const parsedBills = JSON.parse(savedBills);
        if (!Array.isArray(parsedBills)) throw new Error("账单数据格式不正确");

        return parsedBills.filter((bill) =>
          bill &&
          Number.isFinite(bill.amount) &&
          bill.amount > 0 &&
          categories.includes(bill.category) &&
          typeof bill.note === "string" &&
          typeof bill.createdAt === "string"
        );
      } catch (error) {
        console.error("读取账单失败：", error);
        formMessage.textContent = "无法读取已保存的账单，请检查浏览器存储设置。";
        return [];
      }
    }

    let bills = loadBills();

    // 使用完整的新列表先保存，保存成功后再更新页面状态。
    function saveBills(nextBills) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextBills));
        return true;
      } catch (error) {
        console.error("保存账单失败：", error);
        formMessage.textContent = "保存失败，请检查浏览器存储空间或隐私设置后重试。";
        return false;
      }
    }

    // 通过 textContent 写入用户内容，避免备注被当作 HTML 执行。
    function renderBills() {
      billList.replaceChildren();
      const sortedBills = [...bills].sort(
        (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
      );

      for (const bill of sortedBills) {
        const item = document.createElement("li");
        item.className = "bill-item";

        const main = document.createElement("div");
        main.className = "bill-main";

        const title = document.createElement("div");
        title.className = "bill-title";
        title.textContent = bill.note || bill.category;

        const meta = document.createElement("div");
        meta.className = "bill-meta";

        const category = document.createElement("span");
        category.className = "category-tag";
        category.textContent = bill.category;

        const date = document.createElement("time");
        date.dateTime = bill.createdAt;
        date.textContent = new Date(bill.createdAt).toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });

        const amount = document.createElement("span");
        amount.className = "bill-amount";
        amount.textContent = `−¥${bill.amount.toFixed(2)}`;

        meta.append(category, date);
        main.append(title, meta);
        item.append(main, amount);
        billList.append(item);
      }

      totalAmount.textContent = bills
        .reduce((sum, bill) => sum + bill.amount, 0)
        .toFixed(2);
      billCount.textContent = `${bills.length} 笔`;
      emptyState.hidden = bills.length > 0;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      formMessage.textContent = "";

      const amount = Number(amountInput.value);
      if (!Number.isFinite(amount) || amount <= 0) {
        formMessage.textContent = "请输入大于 0 的有效金额。";
        amountInput.focus();
        return;
      }

      const bill = {
        amount: Math.round(amount * 100) / 100,
        category: categoryInput.value,
        note: noteInput.value.trim(),
        createdAt: new Date().toISOString()
      };

      if (!categories.includes(bill.category)) {
        formMessage.textContent = "请选择有效的消费分类。";
        categoryInput.focus();
        return;
      }

      const nextBills = [...bills, bill];
      if (!saveBills(nextBills)) return;

      bills = nextBills;
      renderBills();
      form.reset();
      formMessage.textContent = "账单已添加。";
      amountInput.focus();
    });

    // 每次点击时重新读取本地存储，确保饼图使用当前保存的账单。
    generateChartButton.addEventListener("click", () => {
      chartMessage.textContent = "";

      if (typeof Chart === "undefined") {
        chartMessage.textContent = "图表组件加载失败，请确认本地 Chart.js 文件存在后刷新页面。";
        console.error("Chart.js 未加载，无法生成消费饼图。");
        return;
      }

      let savedBills;
      try {
        const storedData = localStorage.getItem(STORAGE_KEY);
        savedBills = storedData ? JSON.parse(storedData) : [];
        if (!Array.isArray(savedBills)) throw new Error("账单数据格式不正确");
      } catch (error) {
        console.error("读取饼图账单失败：", error);
        chartMessage.textContent = "读取账单失败，请检查浏览器存储数据后重试。";
        return;
      }

      const validBills = savedBills.filter((bill) =>
        bill &&
        Number.isFinite(bill.amount) &&
        bill.amount > 0 &&
        categories.includes(bill.category)
      );
      const categoryTotals = categories.map((category) =>
        validBills.reduce(
          (sum, bill) => sum + (bill.category === category ? bill.amount : 0),
          0
        )
      );
      const grandTotal = categoryTotals.reduce((sum, amount) => sum + amount, 0);

      if (grandTotal <= 0) {
        if (expenseChart) {
          expenseChart.destroy();
          expenseChart = null;
        }
        chartContainer.hidden = true;
        chartMessage.textContent = "暂无可统计的账单，添加账单后再生成饼图。";
        return;
      }

      if (expenseChart) expenseChart.destroy();

      const chartColors = ["#5b7cde", "#f2a65a", "#63b995", "#b18ad8"];
      chartContainer.hidden = false;
      expenseChart = new Chart(expenseChartCanvas, {
        type: "pie",
        data: {
          labels: categories,
          datasets: [{
            data: categoryTotals,
            backgroundColor: chartColors,
            borderColor: "#ffffff",
            borderWidth: 3
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "bottom",
              labels: {
                padding: 18,
                generateLabels(chart) {
                  // 在图例中直接显示占比，避免必须悬停才能查看。
                  return Chart.defaults.plugins.legend.labels.generateLabels(chart).map((label) => {
                    const percentage = (categoryTotals[label.index] / grandTotal * 100).toFixed(1);
                    return {
                      ...label,
                      text: `${label.text} ${percentage}%`
                    };
                  });
                }
              }
            },
            tooltip: {
              callbacks: {
                label(context) {
                  const amount = context.raw;
                  const percentage = (amount / grandTotal * 100).toFixed(1);
                  return ` ${context.label}：¥${amount.toFixed(2)}（${percentage}%）`;
                }
              }
            }
          }
        }
      });

      chartMessage.textContent = `共统计 ¥${grandTotal.toFixed(2)}，图例显示各分类支出占比。`;
    });

    // 每次点击都读取完整本地账单，使用简单规则生成消费概况与建议。
    analyzeBillsButton.addEventListener("click", () => {
      analysisMessage.textContent = "";
      analysisResults.hidden = true;
      analysisBreakdown.replaceChildren();
      analysisTips.replaceChildren();

      let savedBills;
      try {
        const storedData = localStorage.getItem(STORAGE_KEY);
        savedBills = storedData ? JSON.parse(storedData) : [];
        if (!Array.isArray(savedBills)) throw new Error("账单数据格式不正确");
      } catch (error) {
        console.error("读取分析账单失败：", error);
        analysisMessage.textContent = "读取账单失败，请检查浏览器存储数据后重试。";
        return;
      }

      const validBills = savedBills.filter((bill) =>
        bill &&
        Number.isFinite(bill.amount) &&
        bill.amount > 0 &&
        categories.includes(bill.category)
      );
      if (validBills.length === 0) {
        analysisMessage.textContent = "暂无有效账单，添加账单后即可开始分析。";
        return;
      }

      const categoryTotals = Object.fromEntries(
        categories.map((category) => [
          category,
          validBills.reduce(
            (sum, bill) => sum + (bill.category === category ? bill.amount : 0),
            0
          )
        ])
      );
      const grandTotal = Object.values(categoryTotals).reduce((sum, amount) => sum + amount, 0);
      const averageAmount = grandTotal / validBills.length;
      const topCategory = Object.entries(categoryTotals)
        .filter(([, amount]) => amount > 0)
        .sort((a, b) => b[1] - a[1])[0];
      const topPercentage = topCategory[1] / grandTotal * 100;

      // 用户内容只通过 textContent 呈现，避免备注被解析为 HTML。
      analysisSummary.textContent =
        `共记录 ${validBills.length} 笔消费，累计支出 ¥${grandTotal.toFixed(2)}，` +
        `平均每笔 ¥${averageAmount.toFixed(2)}。支出最多的是“${topCategory[0]}”，` +
        `占总支出的 ${topPercentage.toFixed(1)}%。`;

      for (const category of categories) {
        const amount = categoryTotals[category];
        const percentage = amount / grandTotal * 100;
        const item = document.createElement("li");
        item.textContent = `${category}：¥${amount.toFixed(2)}（${percentage.toFixed(1)}%）`;
        analysisBreakdown.append(item);
      }

      const tips = [
        "可以先设定每周生活费预算，定期回看账单，再按实际情况微调。"
      ];
      if (categoryTotals["外卖"] > 0) {
        tips.push(
          `外卖累计 ¥${categoryTotals["外卖"].toFixed(2)}；可尝试提前规划用餐，` +
          "适当减少临时点单，不必为了省钱影响正常饮食。"
        );
      }
      if (categoryTotals["网购"] > 0) {
        tips.push(
          `网购累计 ¥${categoryTotals["网购"].toFixed(2)}；下单前先列清单，` +
          "对非必需品可以隔一天再决定。"
        );
      }
      if (categoryTotals["其他"] > 0) {
        tips.push(
          `“其他”分类累计 ¥${categoryTotals["其他"].toFixed(2)}；补充备注有助于发现` +
          "容易忽略的小额开销。"
        );
      }
      if (topCategory[0] === "食堂") {
        tips.push("食堂是主要支出时，保持规律饮食即可；可留意饮料、零食等额外花销。");
      }

      for (const tip of tips) {
        const item = document.createElement("li");
        item.textContent = tip;
        analysisTips.append(item);
      }

      analysisResults.hidden = false;
      analysisMessage.textContent = "分析完成。结果仅根据本地账单生成，不会上传数据。";
    });

    renderBills();
  </script>
</body>
</html>
